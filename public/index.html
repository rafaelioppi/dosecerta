<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoseCerta</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2312405a'/%3E%3Cpath d='M16 6c4 4.2 7 7.9 7 11.2A7 7 0 1 1 9 17.2C9 13.9 12 10.2 16 6Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
</head>
<body>
  <!--
    Sem site institucional: esta página só decide pra onde mandar quem chega em "/".
    Logada -> calculadora (ou admin, se for o caso). Deslogada -> login.
  -->
  <script src="js/session.js"></script>
  <script>
    document.addEventListener("dosecerta:session", (e) => {
      const session = e.detail;
      if (!session) {
        window.location.href = "/login.html";
      } else if (session.role === "admin") {
        window.location.href = "/admin/";
      } else {
        window.location.href = "/calculadora.html";
      }
    });
  </script>
</body>
</html>
